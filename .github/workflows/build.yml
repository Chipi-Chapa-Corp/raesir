name: Build distributables

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libssl-dev dbus-daemon

      - name: Check application identity and icon assets
        run: python3 -m unittest discover -s scripts -p test_branding.py

      - name: Check package and tag versions
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib, xml.etree.ElementTree as ET
          with open('native/Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          metadata = ET.parse('build/com.chipichapa.exposedgames.metainfo.xml')
          assert metadata.find('releases/release').get('version') == version, 'Update the AppStream release version to match native/Cargo.toml'
          if os.environ['REF'].startswith('refs/tags/v'):
              assert os.environ['REF_NAME'] == f'v{version}', f'Tag must match native/Cargo.toml version v{version}'
          PY

      - name: Test EA and Ubisoft adapters
        run: node --test backend/tests/client-downloads.test.cjs

      - name: Test backend
        run: cargo test --locked --package exposed-games-backend --lib

  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_STRIP: symbols
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-dav1d
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-nsis

      - name: Identify the UCRT64 toolchain and Cargo paths
        id: ucrt64
        run: |
          set -euo pipefail
          toolchain="$( { rustc -vV; pacman -Q; } | sha256sum | cut -d' ' -f1)"
          cargo_home="$(cygpath -am "${CARGO_HOME:-$USERPROFILE/.cargo}")"
          printf 'CARGO_HOME=%s\n' "$cargo_home" >> "$GITHUB_ENV"
          {
            printf 'toolchain=%s\n' "$toolchain"
            printf 'cargo-home=%s\n' "$cargo_home"
            printf 'cargo-target=%s\n' "$(cygpath -am "${CARGO_TARGET_DIR:-$PWD/target}")"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Windows release build dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.ucrt64.outputs.cargo-home }}/registry
            ${{ steps.ucrt64.outputs.cargo-home }}/git
            ${{ steps.ucrt64.outputs.cargo-target }}/release/.fingerprint
            ${{ steps.ucrt64.outputs.cargo-target }}/release/build
            ${{ steps.ucrt64.outputs.cargo-target }}/release/deps
          key: cargo-ucrt64-release-${{ steps.ucrt64.outputs.toolchain }}-${{ hashFiles('native/Cargo.toml', 'backend/Cargo.toml', 'Cargo.toml', 'Cargo.lock', 'scripts/package-windows.sh') }}
          restore-keys: cargo-ucrt64-release-${{ steps.ucrt64.outputs.toolchain }}-

      - name: Test Windows client download and Steam bridges
        run: |
          cargo test --release --locked --package exposed-games-backend --lib -- \
            client_downloads::peer::tests steam_ipc::tests steam_control::tests

      - name: Build and verify NSIS installer
        run: ./scripts/package-windows.sh

      - name: Verify installation
        shell: pwsh
        run: |
          $installer = Join-Path $PWD 'dist/exposed-games-windows-x64-setup.exe'
          if (-not (Test-Path $installer)) { throw 'Windows installer was not produced.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Exposed Games-install'
          $process = Start-Process $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          foreach ($file in 'exposed-games.exe', 'archive.dll', 'LICENSE', 'Uninstall.exe') {
            if (-not (Test-Path (Join-Path $installDir $file))) { throw "Missing installed file: $file" }
          }
          $info = (Get-Item (Join-Path $installDir 'exposed-games.exe')).VersionInfo
          if ($info.ProductName -ne 'Exposed Games' -or $info.FileDescription -ne 'Exposed Games') {
            throw 'Executable branding resources are missing or incorrect.'
          }
          $output = Join-Path $env:RUNNER_TEMP 'exposed-games-version.txt'
          $process = Start-Process (Join-Path $installDir 'exposed-games.exe') -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $output
          if ($process.ExitCode -ne 0 -or (Get-Content $output) -notmatch '^Exposed Games \d+\.\d+\.\d+') {
            throw 'Installed executable did not start correctly.'
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: exposed-games-windows-x64
          path: dist/exposed-games-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux x64 Flatpak
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Flatpak tooling and SDK
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils flatpak flatpak-builder ostree
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --assumeyes --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Validate desktop metadata
        run: |
          appstreamcli validate --strict --explain build/com.chipichapa.exposedgames.metainfo.xml
          desktop-file-validate build/com.chipichapa.exposedgames.desktop

      - name: Identify the Flatpak build environment
        id: flatpak-sdk
        run: |
          sdk="$( {
            flatpak-builder --version
            flatpak info --system --show-commit org.freedesktop.Platform//25.08
            flatpak info --system --show-commit org.freedesktop.Sdk//25.08
            flatpak info --system --show-commit org.freedesktop.Sdk.Extension.rust-stable//25.08
          } | sha256sum | cut -d' ' -f1)"
          printf 'revision=%s\n' "$sdk" >> "$GITHUB_OUTPUT"

      - name: Cache Flatpak modules
        uses: actions/cache@v5
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/downloads
          key: flatpak-${{ runner.arch }}-${{ steps.flatpak-sdk.outputs.revision }}-${{ hashFiles('build/com.chipichapa.exposedgames.json') }}

      - name: Cache Flatpak Rust build dependencies
        uses: actions/cache@v5
        with:
          path: |
            .flatpak-builder/cargo-target/release/.fingerprint
            .flatpak-builder/cargo-target/release/build
            .flatpak-builder/cargo-target/release/deps
          key: cargo-flatpak-${{ runner.arch }}-${{ steps.flatpak-sdk.outputs.revision }}-${{ hashFiles('build/com.chipichapa.exposedgames.json') }}-${{ hashFiles('native/Cargo.toml', 'backend/Cargo.toml', 'Cargo.toml', 'Cargo.lock') }}
          restore-keys: cargo-flatpak-${{ runner.arch }}-${{ steps.flatpak-sdk.outputs.revision }}-${{ hashFiles('build/com.chipichapa.exposedgames.json') }}-

      - name: Build Flatpak bundle
        env:
          EXPOSED_GAMES_FLATPAK_STATE_DIR: .flatpak-builder
        run: ./scripts/package-flatpak.sh

      - name: Build Flatpak update repository
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          ./scripts/package-flatpak-repository.sh
          test -f dist/flatpak-pages/flatpak/summary
          test -f dist/flatpak-pages/flatpak/exposed-games.flatpakref
          flatpak remote-add --user --no-gpg-verify exposed-games-build \
            "file://${GITHUB_WORKSPACE}/dist/flatpak-pages/flatpak"
          flatpak remote-info --user exposed-games-build com.chipichapa.exposedgames

      - name: Verify Flatpak installation
        run: |
          cmp build/exposed-games.flatpakrepo dist/exposed-games.flatpakrepo
          flatpak install --user --assumeyes --noninteractive --no-deps --bundle dist/exposed-games-linux-x64.flatpak
          app_location="$(flatpak info --user --show-location com.chipichapa.exposedgames)"
          cmp LICENSE "${app_location}/files/share/licenses/com.chipichapa.exposedgames/LICENSE"
          # No windows, accounts, or game clients are opened by these checks.
          flatpak run --command=sh com.chipichapa.exposedgames -ec '
            exposed-games --version
            linkage="$(ldd /app/bin/exposed-games /app/lib/libmpv.so.2)"
            if printf "%s\n" "$linkage" | grep "not found"; then exit 1; fi
            test -f /usr/lib/x86_64-linux-gnu/libarchive.so.13
            test -x /app/bin/flatpak
          '

      - name: Upload Flatpak artifacts
        uses: actions/upload-artifact@v7
        with:
          name: exposed-games-linux-x64
          path: |
            dist/exposed-games-linux-x64.flatpak
            dist/exposed-games.flatpakrepo
          if-no-files-found: error
          compression-level: 0

      - name: Upload Flatpak repository for GitHub Pages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/flatpak-pages

  flatpak-pages:
    name: Publish Flatpak repository
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy Flatpak repository
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, windows, linux, flatpak-pages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download distributables
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: exposed-games-*
          merge-multiple: true

      - name: Verify release contents
        run: |
          test -f release-artifacts/exposed-games-windows-x64-setup.exe
          test -f release-artifacts/exposed-games-linux-x64.flatpak
          test -f release-artifacts/exposed-games.flatpakrepo

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
            exit 0
          fi
          prerelease_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --generate-notes --title "Exposed Games ${GITHUB_REF_NAME#v}" "${prerelease_args[@]}"
