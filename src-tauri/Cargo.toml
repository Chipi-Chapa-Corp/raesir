[package]
name = "raesir"
version = "0.1.0"
description = "A unified game library for Windows and Linux"
edition = "2024"
default-run = "raesir"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "raesir_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[[bin]]
name = "raesir"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "raesir-scan"
path = "src/bin/scan.rs"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3"
libloading = "0.8"
steam-vdf-parser = "0.1.2"
roxmltree = "0.21"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_yaml_ng = "0.10"
prost = "0.14"
shlex = "1"
tokio = { version = "1", features = ["sync"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", features = ["blocking-api"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
