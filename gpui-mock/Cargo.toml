[package]
name = "raesir-gpui-mock"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2024"
publish = false

[features]
profile = ["gpui/profiler"]
benchmark = ["profile", "dep:serde_json"]

[dependencies]
gpui = { package = "gpui-ce", version = "=0.3.0", default-features = false }
gpui_platform = { package = "gpui_ce_platform", version = "=0.3.0", default-features = false, features = ["wayland", "x11"] }
gpui_ce_elements = "=0.3.0"
serde_json = { version = "1", optional = true }
image_codec = { package = "image", version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[profile.dev]
debug = 0
incremental = false
