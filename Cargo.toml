[workspace]
members = ["native", "backend"]
default-members = ["native"]
resolver = "3"

[profile.dev]
debug = 0
incremental = true

# The launcher is developed interactively; image decoding and per-pixel card
# processing must not run as unoptimized debug loops.
[profile.dev.package.exposed-games]
opt-level = 2

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3
