[package]
name = "raesir"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2024"
publish = false

[features]
hot-reload = ["gpui/hot-patching"]
profile = ["gpui/profiler"]
benchmark = ["profile"]

[dependencies]
gpui = { package = "gpui-ce", version = "=0.3.0", default-features = false }
gpui_platform = { package = "gpui_ce_platform", version = "=0.3.0", default-features = false, features = ["wayland", "x11"] }
gpui_ce_elements = "=0.3.0"
serde_json = "1"
raesir-backend = { path = "../backend" }
dirs = "7"
libloading = "0.8"
futures = "0.3"
unicode-segmentation = "1"
image_codec = { package = "image", version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "avif-native"] }


[[bin]]
name = "raesir"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
